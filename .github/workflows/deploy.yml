name: Deploy Laravel (FTP)

# Deploys the public site + API to the university server after CI passes on main.
# The admin panel is NOT deployed here - Vercel deploys it from Git on its own.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, release and upload
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: moralenz_dump
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, fileinfo, gd
          coverage: none

      - name: Install production dependencies
        working-directory: laravel
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      # Build the layout from DEPLOYMENT.md section 2.3:
      #   build/laravel       = everything except public/
      #   build/public_html   = contents of public/
      - name: Assemble server layout
        run: |
          mkdir -p build/laravel build/public_html
          rsync -a --exclude='/public' --exclude='.env' --exclude='/storage/logs/*' \
            --exclude='/storage/framework/cache/data' --exclude='/storage/framework/sessions/*' \
            --exclude='/storage/framework/views/*' --exclude='/scripts' \
            laravel/ build/laravel/
          rsync -a --exclude='/uploads/*' laravel/public/ build/public_html/
          sed -i "s#\$appBase = __DIR__.'/..';#\$appBase = __DIR__.'/../laravel';#" build/public_html/index.php
          grep -n "^\$appBase" build/public_html/index.php

      - name: Zip the release
        run: |
          mkdir -p pkg
          (cd build && zip -qr ../pkg/release.zip laravel public_html)
          ls -lh pkg/release.zip

      # dump.sql = empty schema + the `migrations` table rows, built by running
      # every migration on a throwaway MySQL. Import it in phpMyAdmin on a fresh
      # database; it contains no site content.
      - name: Build dump.sql from migrations
        working-directory: laravel
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: moralenz_dump
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          mysqldump -h 127.0.0.1 -uroot -proot --no-data --no-tablespaces             --skip-add-drop-table moralenz_dump > ../pkg/dump.sql
          mysqldump -h 127.0.0.1 -uroot -proot --no-create-info --no-tablespaces             moralenz_dump migrations >> ../pkg/dump.sql
          ls -lh ../pkg/dump.sql

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ github.run_number }}"
          gh release create "$tag" pkg/release.zip pkg/dump.sql             --target "${{ github.event.workflow_run.head_sha || github.sha }}"             --title "Release $tag" --generate-notes

      - name: Upload release.zip
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: pkg/
          exclude: |
            dump.sql
          server-dir: ${{ secrets.FTP_DEPLOY_DIR || '/deploy/' }}
          # The hook deletes the zip after unpacking, so force a re-send.
          dangerous-clean-slate: true

      # Unpacks the zip on the server, runs migrations, clears caches.
      - name: Unpack and migrate on the server
        if: steps.ftp.outcome == 'success'
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          response=$(curl -sS --fail-with-body --max-time 300 -X POST \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" "$DEPLOY_URL")
          echo "$response"
          echo "$response" | grep -q "DEPLOY OK"
